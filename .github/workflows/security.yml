name: Security Audit & Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run NPM Audit
        run: npm audit --audit-level=critical || true

  secret-scan:
    name: Scan Secrets & Leaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Sensitive Files Tracked
        run: |
          echo "Scanning git repository for accidental credential leaks..."
          node -e "
            const { execSync } = require('child_process');
            const files = execSync('git ls-files', { encoding: 'utf8' }).split('\n');
            const forbiddenPatterns = [
              /^\.env$/,
              /\.env\.(local|production|development)$/,
              /\.jks$/,
              /\.keystore$/,
              /^key\.properties$/,
              /firebase-adminsdk.*\.json$/,
              /google-services\.json$/
            ];
            const violations = files.filter(f => forbiddenPatterns.some(p => p.test(f.trim())));
            if (violations.length > 0) {
              console.error('CRITICAL LEAK DETECTED! Forbidden files committed: ', violations);
              process.exit(1);
            }
            console.log('✔ Verification passed: 0 sensitive credential files committed.');
          "
